trigger:
 branches:
   include:
     - main
     - feature*


pool: Default

 
jobs:
  - job:
    displayName: "Terraform Init Validate" 
    steps:
      - task: TerraformInstaller@1
        inputs:
          terraformVersion: 'latest'

      - task: CmdLine@2
        displayName: Terraform Format
        inputs:
          script: 'terraform fmt'
      
      - task: TerraformTask@5
        displayName: terraform init
        inputs:
          provider: 'azurerm'
          command: 'init'
          backendServiceArm: 'sep-serviceconection'
          backendAzureRmResourceGroupName: 'Ali-test'
          backendAzureRmStorageAccountName: 'nahid0562'
          backendAzureRmContainerName: 'adostatefiles'
          backendAzureRmKey: 'landing-zone.infra.tfstate'

      - task: CmdLine@2
        displayName: Terraform Validate
        inputs:
          script: 'terraform validate'
  

  - job:
    displayName: "Terraform Plan Apply" 
    steps:

      - task: TerraformInstaller@1
        inputs:
          terraformVersion: 'latest'

      - task: TerraformTask@5
        displayName: terraform init
        inputs:
          provider: 'azurerm'
          command: 'init'
          backendServiceArm: 'sep-serviceconection'
          backendAzureRmResourceGroupName: 'Ali-test'
          backendAzureRmStorageAccountName: 'nahid0562'
          backendAzureRmContainerName: 'adostatefiles'
          backendAzureRmKey: 'infra.tfstate'

      - task: TerraformTask@5
        displayName: terraform plan
        inputs:
          provider: 'azurerm'
          command: 'plan'
          workingDirectory: '$(System.DefaultWorkingDirectory)'
          environmentServiceNameAzureRM: 'sep-serviceconection'

      - task: TerraformTask@5
        displayName: terraform apply
        inputs:
          provider: 'azurerm'
          command: 'apply'
          environmentServiceNameAzureRM: 'sep-serviceconection'

      - task: TerraformTask@5
        displayName: terraform destroy
        inputs:
          provider: 'azurerm'
          command: 'destroy'
          environmentServiceNameAzureRM: 'sep-serviceconection'


