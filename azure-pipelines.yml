trigger:
- main

pool: Default

steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'
  
  - task: CmdLine@2
    displayName: "Terraform Format"
    inputs:
      script: 'terraform fmt'
  - task: CmdLine@2
    displayName: "Terraform Validate"
    inputs:
      script: 'terraform validate'


  # - script: terraform fmt -check -recursive
  #       displayName:"Terraform Format"
  # - script: terraform validate
  #     displayName:"Terraform Validate"
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'
  
  # - task: TerraformTask@5
  #   inputs:
  #     provider: 'azurerm'
  #     command: 'custom'
  #     outputTo: 'console'
  #     customCommand: 'terraform fmt'
  #     environmentServiceNameAzureRM: 'sep-serviceconection'
  # - task: TerraformTask@5
  #   inputs:
  #     provider: 'azurerm'
  #     command: 'validate'
  - task: tfsec@1
    displayName: Scaning stage
    inputs:
      version: 'v1.26.0'
      dir: '.'
      args: '--format json --out $(Build.ArtifactStagingDirectory)/tfsec-report.json'
  
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: '$(Pipeline.Workspace)/tfsec-report.json'
      artifact: 'tfsec-report'
      publishLocation: 'pipeline'

