trigger:
- main

pool: Default

steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: CmdLine@2
    displayName: "Terraform Format"
    inputs:
      script: 'terraform fmt'

  # - task: CmdLine@2
  #   displayName: "Terraform Validate"
  #   inputs:
  #     script: 'terraform validate'


  # - script: terraform fmt -check -recursive
  #       displayName:"Terraform Format"
  # - script: terraform validate
  #     displayName:"Terraform Validate"
  

  - task: tfsec@1
    displayName: "Scanning stage"
    inputs:
      version: 'v1.26.0'
      dir: '.'
      args: '--format json --out $(Build.ArtifactStagingDirectory)/tfsec-report.json --soft-fail'
    

  - task: CmdLine@2
    displayName: "Verify tfsec Report"
    inputs:
      script: |
        echo "===== Build.ArtifactStagingDirectory ====="
              echo "$(Build.ArtifactStagingDirectory)"
        
              echo "===== Directory contents ====="
              ls -la "$(Build.ArtifactStagingDirectory)" || true
        
              echo "===== Searching for tfsec report ====="
              find "$(Build.SourcesDirectory)" "$(Build.ArtifactStagingDirectory)" -type f -name "*tfsec*" -print 2>/dev/null || true

  - task: Bash@3
    displayName: "Run tfsec"
    inputs:
      targetType: 'inline'
      script: |
        mkdir -p "$(Build.ArtifactStagingDirectory)"

        tfsec "$(Build.SourcesDirectory)" \
          --format json \
          --out "$(Build.ArtifactStagingDirectory)/tfsec-report.json" \
          --soft-fail

        echo "===== tfsec report ====="
        ls -lh "$(Build.ArtifactStagingDirectory)/tfsec-report.json"

  - task: PublishPipelineArtifact@1
    displayName: "Publish tfsec Report"
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/tfsec-report.json'
      artifact: 'tfsec-report'
      publishLocation: 'pipeline'

