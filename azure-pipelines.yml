trigger:
- main

pool: Default

steps:
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'

  - task: CmdLine@2
    displayName: "Terraform Format"
    inputs:
      script: 'terraform fmt'

  # - task: CmdLine@2
  #   displayName: "Terraform Validate"
  #   inputs:
  #     script: 'terraform validate'


  # - script: terraform fmt -check -recursive
  #       displayName:"Terraform Format"
  # - script: terraform validate
  #     displayName:"Terraform Validate"
  

  - task: tfsec@1
    displayName: "Scanning stage"
    inputs:
      version: 'v1.26.0'
      dir: '.'
      args: '--format json --out $(Build.ArtifactStagingDirectory)/tfsec-report.json --soft-fail'

  - task: PublishPipelineArtifact@1
    displayName: "Publish tfsec Report"
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/tfsec-report.json'
      artifact: 'tfsec-report'
      publishLocation: 'pipeline'

